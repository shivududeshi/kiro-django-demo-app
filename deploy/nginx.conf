# Nginx config for Panorbit Django app
# Place at: /etc/nginx/sites-available/panorbit
#
# Then run:
#   sudo ln -s /etc/nginx/sites-available/panorbit /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name 13.201.40.146;

    # Serve collected static files directly (fast, no Django involved)
    location /static/ {
        alias /var/www/kiro-django-demo-app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass         http://unix:/tmp/panorbit.sock;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
    }
}
